<title>Crazy Games at Crazy games.com</title>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazygames.com - We make the good games, For You.</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            padding-bottom: 60px; /* Space so footer doesn't overlap content */
        }

        /* Top Header Bar */
        .header-bar {
            background-color: #cbd5e1; /* Light blue-grey tint */
            padding: 12px 20px;
            font-size: 24px;
            font-weight: normal;
            color: #000000;
            border-bottom: 1px solid #94a3b8;
        }

        /* Game Grid Container */
        .game-grid {
            display: flex;
            gap: 20px;
            padding: 30px 20px;
        }

        /* Individual Card Box */
        .game-card {
            width: 200px;
        //*    text-decoration: none; /* Removes underline from links */
            color: #000000;
            display: flex;
            flex-direction: column;
        }

        /* Black Image Box */
        .game-image {
            width: 200px;
            height: 200px;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            overflow: hidden;
        }

        /* Image sizing inside the box */
        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Blue-grey Label text bar below images */
        .game-label {
            background-color: #cbd5e1;
            padding: 6px 0;
            text-align: center;
            font-size: 18px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
        }

        /* Hover effect to mimic old unpolished button clicks */
        .game-card:hover .game-label {
            background-color: #94a3b8;
            text-decoration: underline;
        }

        /* Sticky Bottom Right Copyright Text Link */
        .footer-link {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #000000;
            text-decoration: none;
            font-family: sans-serif;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Main Banner Top Header -->
    <div class="header-bar">
        Crazygames.com - We make the good games, For You.
    </div>

    <!-- Grid Layout-->
    <div class="game-grid">

        <!-- Game 1: FNaF 4 -->
        <a href="https://gamejolt.com/games/fnaf-4-weird-version/1002493" class="game-card" target="_blank">
            <div class="game-image">
                <!-- fnaf4.jpg -->
                <img src="fnaf4.jpg" alt="Fnaf 4 image" onerror="this.style.display='none';">
                Fnaf 4 image
            </div>
            <div class="game-label">Fnaf 4 full free</div>
        </a>

        <!-- Game 2: FNaF 3 -->
        <a href="https://gamejolt.com/games/fnaf-3-weird-version/974414" class="game-card" target="_blank">
            <div class="game-image">
                <!-- fnaf3.jpg -->
                <img src="fnaf3.jpg" alt="Fnaf 3 image" onerror="this.style.display='none';">
                Fnaf 3 image
            </div>
            <div class="game-label">5naf 3 Free</div>
        </a>

    </div>

    <!-- Clickable link to me -->
    <a href="https://gamejolt.com/@crazygamedeveloper1029" class="footer-link" target="_blank">
        crazy games developer 2015 ©
    </a>

</body>
</html>
